[workspace]
resolver = "2"
members = ["crates/kroma-core", "crates/kroma-app", "crates/kroma-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Djordje Radulovic"]

[workspace.dependencies]
kroma-core = { path = "crates/kroma-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "tga", "ico", "pnm", "qoi", "hdr", "exr"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
psd = "0.3"
ab_glyph = "0.2"
epaint_default_fonts = "0.36"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace.lints.clippy]
# image-processing code indexes several parallel buffers by the same loop counter on purpose
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
enum_variant_names = "allow"
