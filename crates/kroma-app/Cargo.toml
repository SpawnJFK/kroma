[package]
name = "kroma-app"
description = "Kroma: a layered raster image editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kroma-app"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.23"
image = { version = "0.25", default-features = false, features = ["ico"] }

[package.metadata.wix]
eula = false

[dependencies]
kroma-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
arboard = "3"

[lints]
workspace = true
